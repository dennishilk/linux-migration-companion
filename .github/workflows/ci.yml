name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-collector:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      BUILD_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SOURCE_COMMIT }}
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found." }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH collectors/windows-exe/LinuxMigrationCompanion.WindowsCollector.csproj /m /t:Rebuild /p:Configuration=Release "/p:PathMap=$env:GITHUB_WORKSPACE=."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run Windows collector tests
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH collectors/windows-exe/tests/LinuxMigrationCompanion.WindowsCollector.Tests.csproj /m /t:Rebuild /p:Configuration=Release "/p:PathMap=$env:GITHUB_WORKSPACE=."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & collectors/windows-exe/tests/bin/Release/LinuxMigrationCompanion.WindowsCollector.Tests.exe "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage unsigned artifact, checksum and build provenance
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "windows-hardware-snapshot"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $artifact = Join-Path $stage "LinuxMigrationCompanion-HardwareSnapshot.exe"
          Copy-Item collectors/windows-exe/bin/Release/LinuxMigrationCompanion-HardwareSnapshot.exe $artifact
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
          "$hash  LinuxMigrationCompanion-HardwareSnapshot.exe" | Set-Content -Path (Join-Path $stage "LinuxMigrationCompanion-HardwareSnapshot.exe.sha256") -Encoding utf8NoBOM
          $msbuildVersion = (& $env:MSBUILD_PATH -version -nologo | Select-Object -Last 1).Trim()
          @(
            "source_commit=$env:BUILD_SOURCE_COMMIT"
            "runner_image=$env:ImageOS"
            "runner_image_version=$env:ImageVersion"
            "msbuild_version=$msbuildVersion"
            "target_framework=net48"
            "signed=false"
            "sha256=$hash"
          ) | Set-Content -Path (Join-Path $stage "BUILD-INFO.txt") -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v6
        with:
          name: windows-hardware-snapshot-unsigned-${{ env.BUILD_SOURCE_COMMIT }}
          path: ${{ runner.temp }}/windows-hardware-snapshot
          if-no-files-found: error
          retention-days: 14
